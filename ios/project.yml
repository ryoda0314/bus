# XcodeGen の設定。`xcodegen` を実行すると NextBus.xcodeproj ができる。
# 実機に入れるときは BUNDLE_ID / APP_GROUP を自分のものに変え、
# Shared/SharedStore.swift の appGroup も同じ値にする。
name: NextBus
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    BUNDLE_ID: com.ryoda.NextBus
    APP_GROUP: group.com.ryoda.NextBus
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: R73MU4JXA7
    CODE_SIGN_STYLE: Automatic
targets:
  NextBus:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 次のバス
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja, ko]
        UILaunchScreen:
          UIColorName: ""
        NSSupportsLiveActivities: true
        # 暗号化は HTTPS 以外使っていない（輸出コンプライアンスの申告を省く）
        ITSAppUsesNonExemptEncryption: false
        # ヘッダーが紺なので、ステータスバーは常に白文字
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_ID)
            CFBundleURLSchemes: [nextbus]
    entitlements:
      path: App/NextBus.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    dependencies:
      - target: NextBusWidget

  NextBusWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).Widget
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 次のバス
        CFBundleDevelopmentRegion: ja
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/NextBusWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
