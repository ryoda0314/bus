<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>次のバス</title>
<meta name="description" content="阪大 学内連絡バス（豊中→吹田・人間科学部前→豊中）の次の便をカウントダウン表示">
<meta name="theme-color" content="#2d2a7e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="次のバス">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #ffffff;
  --text: #111122;
  --muted: #5c5c6e;
  --line: #c9c9d6;
  --row: #e4e8f4;
  --navy: #2d2a7e;
  --on-navy: #ffffff;
  --red: #c4161c;
  --sel: #2d2a7e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101018; --text: #e8e8f0; --muted: #9a9aae; --line: #34344a; --row: #191926;
    --navy: #22205e; --on-navy: #ffffff; --red: #e0343a; --sel: #9c99f2;
  }
}
:root[data-theme="dark"] {
  --bg: #101018; --text: #e8e8f0; --muted: #9a9aae; --line: #34344a; --row: #191926;
  --navy: #22205e; --on-navy: #ffffff; --red: #e0343a; --sel: #9c99f2;
}
* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: hidden; overscroll-behavior: none; touch-action: pan-y; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
/* 上に引っ張ったときは紺、下は背景色（iOS が上端の色を拾っても紺になるように） */
html { background-color: var(--navy); }
body {
  background: var(--bg);
  min-height: 100vh;
  min-height: 100dvh;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: env(safe-area-inset-bottom);
}

/* 掲示時刻表の紺帯 */
/* 上端に固定した不透明ヘッダー。iOS 26 Safari はこれを見てステータスバー部分を同じ色で塗る */
.band { position: sticky; top: 0; z-index: 10; background-color: var(--navy); color: var(--on-navy); }
.band-in { max-width: 480px; margin: 0 auto; padding: 12px 16px 0; }
.band-top { display: flex; justify-content: space-between; align-items: baseline; }
h1 { font-size: 17px; margin: 0; letter-spacing: .04em; }
h1 .en { display: block; font-size: 11px; font-weight: 400; opacity: .75; letter-spacing: 0; }
.band-right { display: flex; align-items: center; gap: 10px; }
#clock { font-variant-numeric: tabular-nums; font-size: 15px; opacity: .85; }
#langBtn {
  border: 1px solid rgba(255,255,255,.5); background: transparent; color: var(--on-navy);
  font: inherit; font-size: 12px; padding: 3px 8px; cursor: pointer;
}
.seg { display: flex; margin-top: 10px; }
.seg button {
  flex: 1; border: 0; background: transparent; color: var(--on-navy); font: inherit; opacity: .65;
  font-size: 15px; font-weight: 700; padding: 8px 2px 7px; cursor: pointer; line-height: 1.25;
  border-bottom: 3px solid transparent;
}
.seg button small { display: block; font-size: 12px; font-weight: 400; }
.seg button[aria-pressed="true"] { opacity: 1; border-bottom-color: var(--on-navy); }

main { max-width: 480px; margin: 0 auto; padding: 14px 16px 16px; }
.chips { display: flex; border: 1px solid var(--line); }
.chips button {
  flex: 1; border: 0; border-left: 1px solid var(--line); background: transparent; color: var(--muted);
  font: inherit; font-size: 14px; padding: 8px 4px; cursor: pointer;
}
.chips button:first-child { border-left: 0; }
.chips button[aria-pressed="true"] { background: var(--sel); color: var(--bg); font-weight: 700; }

.hero { padding: 22px 0 18px; border-bottom: 1px solid var(--line); }
.hero .dep { font-size: 15px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.hero .dep b { font-size: 22px; color: var(--text); font-variant-numeric: tabular-nums; }
.hero .count { font-size: clamp(44px, 15vw, 64px); white-space: nowrap; font-weight: 800; line-height: 1.05; margin: 6px 0 8px; font-variant-numeric: tabular-nums; }
.hero .count small { font-size: 20px; font-weight: 700; margin: 0 6px 0 2px; }
.hero .count .pre { font-size: 20px; font-weight: 700; margin-right: 6px; }
.hero .count .post { font-size: 20px; font-weight: 700; margin-left: 2px; }
.hero .sub { color: var(--muted); font-size: 14px; }
.hero .note { color: var(--text); font-weight: 700; margin-top: 4px; }
.hero.soon .count { color: var(--red); animation: blink 1s steps(2, start) infinite; }
.hero .msg { font-size: 20px; font-weight: 700; margin: 0 0 10px; }
@keyframes blink { 50% { opacity: .4; } }
@media (prefers-reduced-motion: reduce) { .hero.soon .count { animation: none; } }

/* 掲示物と同じ記号 */
.tag { display: inline-block; font-size: 12px; font-weight: 700; line-height: 1; padding: 4px 5px; }
.tag.exp { background: var(--red); color: #fff; }
.tag.via { border: 1px solid var(--line); color: var(--muted); font-weight: 400; padding: 3px 5px; }
.tag.orig { background: var(--text); color: var(--bg); }
.tag.ev { color: var(--muted); font-weight: 400; padding-left: 0; padding-right: 0; }

h2 { font-size: 13px; color: var(--muted); font-weight: 400; margin: 18px 0 6px; }
ul.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
ul.list li { display: flex; align-items: center; padding: 11px 4px; border-bottom: 1px solid var(--line); gap: 8px; }
ul.list li:nth-child(odd) { background: var(--row); }
ul.list .t { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 62px; }
ul.list .d { flex: 1; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
ul.list .r { font-size: 14px; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
ul.list li.empty { color: var(--muted); justify-content: center; }

footer { color: var(--muted); font-size: 12px; margin: 20px 0 8px; line-height: 1.7; }
footer a { color: inherit; }
</style>
</head>
<body>
<div class="band">
  <div class="band-in">
    <div class="band-top">
      <h1><span id="title">学内連絡バス</span><span class="en">Inter Campus Shuttle Bus</span></h1>
      <div class="band-right">
        <button id="langBtn" type="button" lang="ko">한국어</button>
        <span id="clock"></span>
      </div>
    </div>
    <div class="seg" id="stopTabs" role="group" aria-label="乗り場"></div>
  </div>
</div>
<main>
  <div class="chips" id="dirChips" role="group" aria-label="方面"></div>

  <section class="hero" id="hero" aria-live="polite"></section>

  <h2 id="laterTitle"></h2>
  <ul class="list" id="later"></ul>

  <footer>
    <span id="footNote"></span>
    <a href="https://sairibus.com/bus/timetable/" target="_blank" rel="noopener" id="footLink"></a>
  </footer>
</main>

<script>
// ===== 時刻表データ（2026/4/1改正） =====
// flags: x=直行, v=箕面経由, e=電気バス
// express: 直行の所要分 / via: 箕面経由の [箕面まで, 終点まで] の所要分
const DIRS = [
  { id: "all", filter: null },
  { id: "express", filter: "x" },
  { id: "via", filter: "v" },
];
const STOPS = {
  toyonaka: {
    to: "suita", express: 30, via: [20, 40], viaNote: true,
    times: [
      "8:00 x","8:05 x","8:10 x","8:45 x","9:00 xe","9:20 v","9:45 x","9:50 x","10:40 x",
      "10:50 x","11:30 v","12:05 x","12:10 x","12:40 ve","12:45 x","12:55 x","13:35 v",
      "14:25 ve","15:10 v","15:30 x","16:00 v","16:30 x","16:55 x","17:20 ve","17:25 x",
      "17:40 v","18:00 x","18:30 v","18:55 x","19:25 v","20:10 v"],
  },
  ningen: {
    to: "toyonaka", express: 25, via: [20, 40],
    times: [
      "8:00 v","8:35 v","9:00 v","9:25 x","9:35 xe","10:05 v","10:45 v","11:20 v","11:25 x",
      "12:15 xe","12:20 x","12:40 x","12:45 v","13:40 ve","14:20 v","15:15 xe","15:20 x",
      "16:05 x","16:10 v","16:55 x","17:05 x","17:30 v","18:00 x","18:15 ve","18:35 x",
      "18:45 x","19:15 v","19:50 v","20:15 v","20:25 x"],
  },
  kougaku: {
    to: "toyonaka", express: 30, via: [25, 45],
    times: [
      "7:55 v","8:30 v","8:55 v","9:20 x","9:30 xe","10:00 v","10:40 v","11:15 v","11:20 x",
      "12:10 xe","12:15 x","12:35 x","12:40 v","13:35 ve","14:15 v","15:10 xe","15:15 x",
      "16:00 x","16:05 v","16:50 x","17:00 x","17:25 v","17:55 x","18:10 ve","18:30 x",
      "18:40 x","19:10 v","19:45 v","20:10 v","20:20 x"],
  },
};

// ===== 表示文言（日本語 / 한국어） =====
const I18N = {
  ja: {
    title: "学内連絡バス", other: "한국어", otherLang: "ko",
    stops: { toyonaka: ["豊中", "→ 吹田"], kougaku: ["工学部前", "→ 豊中"], ningen: ["人科前", "→ 豊中"] },
    place: { suita: "吹田", toyonaka: "豊中", minoh: "箕面" },
    dirs: { all: "すべて", express: "直行", via: "箕面経由" },
    tagExp: "直", tagVia: "箕面経由", tagOrig: "当駅始発", tagEv: "電気バス",
    viaNote: "箕面行の列に並んでください",
    destExp: to => `${to}（直行）`, destVia: to => `箕面経由 ${to}`, destLine: d => `${d}行`,
    next: t => `次 <b>${t}</b> 発`, nextDay: (day, t) => `次は ${day}<b>${t}</b> 発`,
    pre: "あと", post: "", h: "時間", m: "分", s: "秒", soon: "まもなく発車",
    arr: (place, t) => `${place} ${t} 着`, arrEnd: "予定",
    ended: "本日の運行は終了しました", closed: "本日は運休です", none: "しばらく運行予定がありません",
    later: "このあと", laterNone: "このあとの便はありません",
    inMin: (h, m) => h ? `${h}時間${m}分後` : `${m}分後`,
    tomorrow: "明日", wd: "日月火水木金土",
    foot: "2026.04.01 改正ダイヤ。土日祝・運休日は運休。<br>道路の混雑で遅れることがあります。",
    link: "公式時刻表（再履バス同好会）",
  },
  ko: {
    title: "학내 연락버스", other: "日本語", otherLang: "ja",
    stops: { toyonaka: ["도요나카", "→ 스이타"], kougaku: ["공학부", "→ 도요나카"], ningen: ["인간과학부", "→ 도요나카"] },
    place: { suita: "스이타", toyonaka: "도요나카", minoh: "미노오" },
    dirs: { all: "전체", express: "직행", via: "미노오 경유" },
    tagExp: "직행", tagVia: "미노오 경유", tagOrig: "시발", tagEv: "전기버스",
    viaNote: "미노오행 줄에 서 주세요",
    destExp: to => `${to} (직행)`, destVia: to => `미노오 경유 ${to}`, destLine: d => `${d}행`,
    next: t => `다음 <b>${t}</b> 출발`, nextDay: (day, t) => `다음 ${day}<b>${t}</b> 출발`,
    pre: "", post: "남음", h: "시간", m: "분", s: "초", soon: "곧 출발",
    arr: (place, t) => `${place} ${t} 도착`, arrEnd: " 예정",
    ended: "오늘 운행은 종료되었습니다", closed: "오늘은 운행하지 않습니다", none: "당분간 운행 예정이 없습니다",
    later: "이후 버스", laterNone: "이후 버스가 없습니다",
    inMin: (h, m) => h ? `${h}시간 ${m}분 후` : `${m}분 후`,
    tomorrow: "내일", wd: "일월화수목금토",
    foot: "2026.04.01 개정 시간표. 주말·공휴일·운휴일에는 운행하지 않습니다.<br>도로 혼잡으로 늦어질 수 있습니다.",
    link: "공식 시간표 (再履バス同好会)",
  },
};
let T = I18N.ja;

// ===== 運休日（公式Googleカレンダーより、終了日を含む） =====
const CLOSED_RANGES = [
  ["2026-04-01","2026-04-09"], ["2026-04-29","2026-04-29"], ["2026-05-04","2026-05-06"],
  ["2026-08-11","2026-09-30"], ["2026-11-02","2026-11-04"], ["2026-12-26","2027-01-03"],
  ["2027-02-04","2027-02-04"], ["2027-02-09","2027-03-31"],
];
// ===== 祝日（土日祝は記載が無くても運休） =====
const HOLIDAYS = new Set([
  "2026-01-01","2026-01-12","2026-02-11","2026-02-23","2026-03-20","2026-04-29","2026-05-03",
  "2026-05-04","2026-05-05","2026-05-06","2026-07-20","2026-08-11","2026-09-21","2026-09-22",
  "2026-09-23","2026-10-12","2026-11-03","2026-11-23",
  "2027-01-01","2027-01-11","2027-02-11","2027-02-23","2027-03-21","2027-03-22",
]);

// ===== 時刻ユーティリティ（端末TZに関係なくJSTで計算） =====
const JST = 9 * 3600 * 1000;
const params = new URLSearchParams(location.search);
// デバッグ: ?t=2026-10-05T12:30 で現在時刻を固定（JSTとして解釈、以後は進む）
const debugOffset = params.has("t") ? Date.parse(params.get("t") + ":00Z") - JST - Date.now() : 0;
const nowMs = () => Date.now() + debugOffset;

// JSTの「その日の0時」をUTCミリ秒で返す
const jstDayStart = ms => Math.floor((ms + JST) / 86400000) * 86400000 - JST;
const ymd = dayStart => new Date(dayStart + JST).toISOString().slice(0, 10);
const pad = n => String(n).padStart(2, "0");
const hm = ms => { const d = new Date(ms + JST); return `${d.getUTCHours()}:${pad(d.getUTCMinutes())}`; };

function isServiceDay(dayStart) {
  const key = ymd(dayStart);
  const dow = new Date(dayStart + JST).getUTCDay();
  if (dow === 0 || dow === 6 || HOLIDAYS.has(key)) return false;
  return !CLOSED_RANGES.some(([a, b]) => key >= a && key <= b);
}

function parseTimes(list) {
  return list.map(s => {
    const [t, f = ""] = s.split(" ");
    const [h, m] = t.split(":").map(Number);
    return { min: h * 60 + m, flags: f };
  });
}

// 選択中の乗り場/方面の便一覧（到着情報つき）
function currentTrips() {
  const stop = STOPS[state.stop];
  const dir = DIRS.find(d => d.id === state.dir) || DIRS[0];
  return parseTimes(stop.times)
    .filter(b => !dir.filter || b.flags.includes(dir.filter))
    .map(b => b.flags.includes("x")
      ? { ...b, dest: T.destExp(T.place[stop.to]), ride: stop.express }
      : { ...b, dest: T.destVia(T.place[stop.to]), viaMin: stop.via[0], ride: stop.via[1],
          note: stop.viaNote ? T.viaNote : "" });
}

// 今以降の便を、運行日をまたいで最大n件
function upcoming(n) {
  const trips = currentTrips();
  const out = [];
  let day = jstDayStart(nowMs());
  for (let i = 0; i < 60 && out.length < n; i++, day += 86400000) {
    if (!isServiceDay(day)) continue;
    for (const b of trips) {
      const dep = day + b.min * 60000;
      if (dep >= nowMs() - 30000) out.push({ ...b, dep, day });
      if (out.length >= n) break;
    }
  }
  return out;
}

function tagsHtml(b) {
  let h = "";
  if (b.flags.includes("x")) h += `<span class="tag exp">${T.tagExp}</span>`;
  if (b.flags.includes("v")) h += `<span class="tag via">${T.tagVia}</span>`;
  if (b.flags.includes("o")) h += `<span class="tag orig">${T.tagOrig}</span>`;
  if (b.flags.includes("e")) h += `<span class="tag ev">${T.tagEv}</span>`;
  return h;
}

function dayLabel(day) {
  const today = jstDayStart(nowMs());
  const diff = Math.round((day - today) / 86400000);
  if (diff === 0) return "";
  if (diff === 1) return T.tomorrow + " ";
  const d = new Date(day + JST);
  return `${d.getUTCMonth() + 1}/${d.getUTCDate()}(${T.wd[d.getUTCDay()]}) `;
}

// ===== 状態 =====
const state = { stop: "toyonaka", dir: "all",
  lang: (navigator.language || "").toLowerCase().startsWith("ko") ? "ko" : "ja" };
try {
  const saved = JSON.parse(localStorage.getItem("bus-state") || "null");
  if (saved && STOPS[saved.stop]) Object.assign(state, saved);
} catch (e) {}
if (STOPS[params.get("s")]) state.stop = params.get("s");
if (!DIRS.some(d => d.id === state.dir)) state.dir = "all";
if (I18N[params.get("lang")]) state.lang = params.get("lang");
if (!I18N[state.lang]) state.lang = "ja";
function save() { try { localStorage.setItem("bus-state", JSON.stringify(state)); } catch (e) {} }

function renderTabs() {
  T = I18N[state.lang];
  document.documentElement.lang = state.lang;
  document.getElementById("title").textContent = T.title;
  const langBtn = document.getElementById("langBtn");
  langBtn.textContent = T.other;
  langBtn.lang = T.otherLang;
  document.getElementById("laterTitle").textContent = T.later;
  document.getElementById("footNote").innerHTML = T.foot + " ";
  document.getElementById("footLink").textContent = T.link;
  document.getElementById("stopTabs").innerHTML = Object.keys(STOPS).map(id =>
    `<button data-stop="${id}" aria-pressed="${state.stop === id}">${T.stops[id][0]}<small>${T.stops[id][1]}</small></button>`).join("");
  document.getElementById("dirChips").innerHTML = DIRS.map(d =>
    `<button data-dir="${d.id}" aria-pressed="${state.dir === d.id}">${T.dirs[d.id]}</button>`).join("");
}

document.getElementById("langBtn").addEventListener("click", () => {
  state.lang = T.otherLang; save(); renderTabs(); tick();
});

document.getElementById("stopTabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.stop = b.dataset.stop;
  save(); renderTabs(); tick();
});
document.getElementById("dirChips").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.dir = b.dataset.dir; save(); renderTabs(); tick();
});

function tick() {
  const now = nowMs();
  const d = new Date(now + JST);
  document.getElementById("clock").textContent =
    `${d.getUTCHours()}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`;

  const list = upcoming(7);
  const hero = document.getElementById("hero");
  const today = jstDayStart(now);
  const next = list[0];

  if (!next) {
    hero.className = "hero";
    hero.innerHTML = `<div class="msg">${T.none}</div>`;
  } else if (next.day !== today) {
    // 今日はもう無い（運休日 or 最終便後）
    const reason = isServiceDay(today) ? T.ended : T.closed;
    hero.className = "hero";
    hero.innerHTML = `<div class="msg">${reason}</div>
      <div class="dep">${T.nextDay(dayLabel(next.day), hm(next.dep))} ${tagsHtml(next)}</div>
      <div class="sub">${T.destLine(next.dest)}</div>`;
  } else {
    const sec = Math.max(0, Math.round((next.dep - now) / 1000));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    const count = h ? `${h}<small>${T.h}</small>${pad(m)}<small>${T.m}</small>` : `${m}<small>${T.m}</small>${pad(s)}<small>${T.s}</small>`;
    const end = T.arr(next.viaMin ? T.place[STOPS[state.stop].to] : next.dest, hm(next.dep + next.ride * 60000)) + T.arrEnd;
    const arr = next.viaMin ? `${T.arr(T.place.minoh, hm(next.dep + next.viaMin * 60000))} → ${end}` : end;
    hero.className = "hero" + (sec <= 120 ? " soon" : "");
    const pre = T.pre ? `<span class="pre">${T.pre}</span>` : "";
    const post = T.post ? `<span class="post">${T.post}</span>` : "";
    hero.innerHTML = `<div class="dep">${T.next(hm(next.dep))} ${tagsHtml(next)}</div>
      <div class="count">${sec === 0 ? T.soon : pre + count + post}</div>
      <div class="sub">${arr}</div>${next.note ? `<div class="sub note">${next.note}</div>` : ""}`;
  }

  const rest = list.slice(1);
  document.getElementById("later").innerHTML = rest.length
    ? rest.map(b => {
        const mins = Math.round((b.dep - now) / 60000);
        const r = b.day !== today ? dayLabel(b.day).trim()
          : T.inMin(Math.floor(mins / 60), mins % 60);
        return `<li><span class="t">${hm(b.dep)}</span><span class="d">${tagsHtml(b)}</span><span class="r">${r}</span></li>`;
      }).join("")
    : `<li class="empty">${T.laterNone}</li>`;
}

renderTabs();
tick();
setInterval(tick, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });

// iOS Safari は user-scalable=no を無視するので、ピンチとダブルタップの拡大を止める
["gesturestart", "gesturechange", "gestureend"].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
